name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: courtbook
          POSTGRES_USER: courtbook
          POSTGRES_PASSWORD: courtbook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U courtbook -d courtbook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://courtbook:courtbook@localhost:5432/courtbook
      REDIS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -q

      - name: Pytest
        run: pytest -q
